<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - GeoSafe</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#F1F5F9] text-[#0F172A] antialiased min-h-screen flex flex-col justify-center items-center p-4 sm:p-6 font-sans">

  <main class="w-full max-w-[420px] bg-white rounded-[8px] border border-[#CBD5E1] shadow-sm overflow-hidden">
    <div class="bg-[#0B203B] px-6 py-5 flex items-center gap-3">
      <img src="./assets/icons/geosafe-logo.jpg" alt="GeoSafe Logo" class="w-9 h-9 rounded-full object-cover flex-shrink-0 border border-white/25" style="border-radius: 50%;">
      <div>
        <span class="text-base font-bold tracking-tight text-white block leading-tight">GeoSafe</span>
        <span class="text-[11px] text-[#9EB8D6] block leading-tight">Barangay Bayanan Emergency Operations Center</span>
      </div>
    </div>

    <div class="p-6 sm:p-7 space-y-5">
      <div>
        <h1 class="text-xl font-bold text-[#0F172A] tracking-tight">Forgot Password</h1>
        <p class="text-xs text-[#64748B] mt-1 leading-relaxed">
          Enter your registered email address and we will send you a single-use link to reset your password.
        </p>
      </div>

      <div id="forgot-error-box" class="hidden p-3 rounded-[6px] bg-red-50 border border-red-200 text-xs font-medium text-[#DC2626]"></div>

      <div id="forgot-success-box" class="hidden p-4 rounded-[6px] bg-teal-50 border border-teal-200 space-y-2">
        <p class="text-xs font-semibold text-[#0F172A]">Check your email</p>
        <p id="forgot-success-text" class="text-xs text-[#334155] leading-relaxed"></p>
      </div>

      <form id="forgot-password-form" class="space-y-4" novalidate>
        <div>
          <label for="forgot-email" class="block text-xs font-semibold text-[#1E293B] mb-1.5">Email Address</label>
          <input
            type="email"
            id="forgot-email"
            name="email"
            required
            autocomplete="email"
            placeholder="name@bayanan.gov.ph"
            class="w-full h-11 px-3.5 rounded-[6px] border border-[#CBD5E1] bg-white text-sm text-[#0F172A] placeholder-[#94A3B8] focus:outline-none focus:border-[#164579] focus:ring-2 focus:ring-[#164579]/20"
          >
        </div>

        <button
          type="submit"
          id="forgot-submit-btn"
          class="w-full h-11 px-4 rounded-[6px] bg-[#164579] hover:bg-[#103661] text-white font-semibold text-sm transition-colors flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#164579]"
        >
          <span id="forgot-btn-text">Send Reset Link</span>
          <svg id="forgot-btn-spinner" class="hidden animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </button>
      </form>

      <div class="pt-4 border-t border-[#E2E8F0] flex items-center justify-between text-xs">
        <a href="login.html" class="font-semibold text-[#164579] hover:underline">&larr; Back to Sign In</a>
        <span class="text-[#64748B]">Expires in 30 minutes</span>
      </div>
    </div>
  </main>

  <script src="./assets/js/forgot-password.js"></script>
</body>
</html>
