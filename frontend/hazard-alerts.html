<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerts - GeoSafe Resident Portal | Barangay Bayanan</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#FFFDF7] text-[#202020] antialiased min-h-screen flex flex-col font-sans overflow-x-hidden resident-layout">

  <!-- Top Navigation Bar (Desktop, Tablet & Mobile Header) -->
  <div id="geosafe-nav-container"></div>

  <!-- Main Content -->
  <main class="flex-1 p-3.5 sm:p-5 lg:p-6 pb-28 md:pb-8 max-w-5xl mx-auto w-full space-y-3">

    <!-- Compact Page Title & Filter / Sort Controls -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <h1 class="text-lg sm:text-xl font-extrabold text-[#202020] tracking-tight">Hazard Alerts</h1>
        <span id="alerts-total-badge" class="text-[10px] font-bold text-[#8A6800] bg-[#FFF9E8] border border-[#FFE872] px-2.5 py-0.5 rounded-full">0 Active</span>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <select id="alerts-filter-type" onchange="applyAlertsFilterAndSort()"
          class="h-8 px-2.5 rounded-xl border border-[#EEEEEE] bg-white text-xs font-semibold text-[#202020] focus:outline-none focus:border-[#F5B900]">
          <option value="All">All Categories</option>
        </select>
        <select id="alerts-filter-status" onchange="loadHazardAlerts()"
          class="h-8 px-2.5 rounded-xl border border-[#EEEEEE] bg-white text-xs font-semibold text-[#202020] focus:outline-none focus:border-[#F5B900]">
          <option value="active">Active &amp; Expired</option>
          <option value="all">Include Archived</option>
        </select>
        <select id="alerts-sort-order" onchange="applyAlertsFilterAndSort()"
          class="h-8 px-2.5 rounded-xl border border-[#EEEEEE] bg-white text-xs font-semibold text-[#202020] focus:outline-none focus:border-[#F5B900]">
          <option value="priority">Priority (Urgent First)</option>
          <option value="newest">Newest First</option>
        </select>
      </div>
    </div>

    <!-- Loading State -->
    <div id="alerts-loading" class="py-10 text-center">
      <div class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-[#FFE872] border-t-[#F5B900] mb-2"></div>
      <p class="text-xs font-medium text-[#777777]">Loading alerts...</p>
    </div>

    <!-- Error State -->
    <div id="alerts-error" class="hidden p-4 rounded-2xl bg-[#FFF1F1] border border-[#FFC2C2] flex items-center justify-between gap-3">
      <div class="min-w-0">
        <strong class="text-xs font-bold text-[#D93636] block">Alert feed unavailable</strong>
        <p id="alerts-error-text" class="text-[11px] text-[#D93636]">Please verify network connectivity.</p>
      </div>
      <button type="button" onclick="loadHazardAlerts()" class="px-3 py-1.5 bg-[#D93636] hover:bg-[#B82828] text-white rounded-xl text-xs font-bold flex-shrink-0">
        Retry
      </button>
    </div>

    <!-- Compact Empty State -->
    <div id="alerts-empty" class="hidden p-4 rounded-2xl bg-white border border-[#EEEEEE] shadow-subtle flex items-center gap-3">
      <div class="w-8 h-8 rounded-xl bg-emerald-50 text-[#278653] border border-emerald-200 flex items-center justify-center flex-shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      </div>
      <span class="text-xs sm:text-sm font-bold text-[#202020]">No alerts at the moment.</span>
    </div>

    <!-- Alerts Cards Container -->
    <div id="alerts-list-container" class="hidden">
      <div id="alerts-list" class="space-y-3">
        <!-- Injected dynamically via hazard-alerts.js -->
      </div>
    </div>

  </main>

  <!-- Advisory Detail Modal -->
  <div id="advisory-detail-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-5 sm:p-6 shadow-card border border-[#EEEEEE] space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-start justify-between gap-3 pb-3 border-b border-[#EEEEEE]">
        <div class="space-y-1.5 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span id="modal-adv-badge"></span>
            <span id="modal-adv-status" class="text-[10px] font-bold px-2 py-0.5 rounded-full border">Active</span>
          </div>
          <h2 id="modal-adv-title" class="text-base font-extrabold text-[#202020] leading-snug">-</h2>
        </div>
        <button type="button" onclick="closeAdvisoryDetailModal()" class="p-1.5 rounded-xl text-[#777777] hover:text-[#202020] hover:bg-[#FFF9E8]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="space-y-3 text-xs">
        <p id="modal-adv-message" class="text-[#202020] whitespace-pre-line leading-relaxed">-</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 p-3 rounded-2xl bg-[#FFFDF7] border border-[#EEEEEE]">
          <div>
            <span class="text-[10px] font-bold text-[#777777] uppercase block">Target Scope / Area</span>
            <span id="modal-adv-area" class="font-semibold text-[#202020]">-</span>
          </div>
          <div>
            <span class="text-[10px] font-bold text-[#777777] uppercase block">Published</span>
            <span id="modal-adv-date" class="font-semibold text-[#202020]">-</span>
          </div>
          <div>
            <span class="text-[10px] font-bold text-[#777777] uppercase block">Issued By</span>
            <span id="modal-adv-author" class="font-semibold text-[#202020]">-</span>
          </div>
          <div>
            <span class="text-[10px] font-bold text-[#777777] uppercase block">Reference</span>
            <span id="modal-adv-ref" class="font-mono font-bold text-[#202020]">-</span>
          </div>
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 pt-2">
        <a href="evacuation-routes.html" class="px-4 py-2 rounded-xl bg-[#FFF9E8] hover:bg-[#F5B900] border border-[#FFE872] text-xs font-bold text-[#202020]">Evacuation Routes</a>
        <button type="button" onclick="closeAdvisoryDetailModal()" class="px-4 py-2 rounded-xl bg-[#202020] text-white text-xs font-bold">Close</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./assets/js/mock-data.js"></script>
  <script src="./assets/js/store.js"></script>
  <script src="./assets/js/toast.js"></script>
  <script src="./assets/js/components.js"></script>
  <script src="./assets/js/advisory-categories.js"></script>
  <script src="./assets/js/hazard-alerts.js"></script>
</body>
</html>
