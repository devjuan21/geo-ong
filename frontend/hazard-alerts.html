<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerts - GeoSafe Resident Portal | Barangay Bayanan</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .filter-scroll-row {
      -ms-overflow-style: none;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .filter-scroll-row::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-[#FFFDF7] text-[#202020] antialiased min-h-screen flex flex-col font-sans overflow-x-hidden">

  <!-- Top Navigation Bar (Desktop, Tablet & Mobile Header) -->
  <div id="geosafe-nav-container"></div>

  <!-- Main Content -->
  <main class="flex-1 p-3.5 sm:p-5 lg:p-6 pb-24 md:pb-10 max-w-5xl mx-auto w-full space-y-3">

    <!-- Compact Page Title -->
    <div class="flex items-center justify-between gap-3">
      <h1 class="text-lg sm:text-xl font-extrabold text-[#202020] tracking-tight">Alerts</h1>
    </div>

    <!-- Severity Filter Buttons (Single-Row Scrollable on Mobile) -->
    <div class="filter-scroll-row flex flex-nowrap items-center gap-2 overflow-x-auto w-full">
      <button type="button" class="severity-tab-btn h-8 px-3 rounded-xl text-xs font-bold bg-[#F5B900] text-[#202020] border border-[#F5B900] shadow-subtle transition-all inline-flex items-center justify-center whitespace-nowrap flex-shrink-0" data-severity="All">
        <span>All</span>
      </button>
      <button type="button" class="severity-tab-btn h-8 px-3 rounded-xl text-xs font-semibold bg-white text-[#555555] hover:bg-[#FFF9E8] border border-[#EEEEEE] transition-all inline-flex items-center justify-center gap-1 whitespace-nowrap flex-shrink-0" data-severity="Critical">
        <span class="w-2 h-2 rounded-full bg-[#D93636] flex-shrink-0"></span>
        <span>Critical</span>
      </button>
      <button type="button" class="severity-tab-btn h-8 px-3 rounded-xl text-xs font-semibold bg-white text-[#555555] hover:bg-[#FFF9E8] border border-[#EEEEEE] transition-all inline-flex items-center justify-center gap-1 whitespace-nowrap flex-shrink-0" data-severity="High">
        <span class="w-2 h-2 rounded-full bg-rose-500 flex-shrink-0"></span>
        <span>High</span>
      </button>
      <button type="button" class="severity-tab-btn h-8 px-3 rounded-xl text-xs font-semibold bg-white text-[#555555] hover:bg-[#FFF9E8] border border-[#EEEEEE] transition-all inline-flex items-center justify-center gap-1 whitespace-nowrap flex-shrink-0" data-severity="Moderate">
        <span class="w-2 h-2 rounded-full bg-amber-500 flex-shrink-0"></span>
        <span>Moderate</span>
      </button>
      <button type="button" class="severity-tab-btn h-8 px-3 rounded-xl text-xs font-semibold bg-white text-[#555555] hover:bg-[#FFF9E8] border border-[#EEEEEE] transition-all inline-flex items-center justify-center gap-1 whitespace-nowrap flex-shrink-0" data-severity="Low">
        <span class="w-2 h-2 rounded-full bg-blue-500 flex-shrink-0"></span>
        <span>Low</span>
      </button>
    </div>

    <!-- Loading State -->
    <div id="alerts-loading" class="py-10 text-center">
      <div class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-[#FFE872] border-t-[#F5B900] mb-2"></div>
      <p class="text-xs font-medium text-[#777777]">Loading alerts...</p>
    </div>

    <!-- Error State -->
    <div id="alerts-error" class="hidden p-4 rounded-2xl bg-[#FFF1F1] border border-[#FFC2C2] flex items-center justify-between gap-3">
      <div class="min-w-0">
        <strong class="text-xs font-bold text-[#D93636] block">Alert feed unavailable</strong>
        <p id="alerts-error-text" class="text-[11px] text-[#D93636]">Please verify network connectivity.</p>
      </div>
      <button type="button" onclick="loadHazardAlerts()" class="px-3 py-1.5 bg-[#D93636] hover:bg-[#B82828] text-white rounded-xl text-xs font-bold flex-shrink-0">
        Retry
      </button>
    </div>

    <!-- Compact Empty State -->
    <div id="alerts-empty" class="hidden p-4 rounded-2xl bg-white border border-[#EEEEEE] shadow-subtle flex items-center gap-3">
      <div class="w-8 h-8 rounded-xl bg-emerald-50 text-[#278653] border border-emerald-200 flex items-center justify-center flex-shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      </div>
      <span class="text-xs sm:text-sm font-bold text-[#202020]">No active alerts</span>
    </div>

    <!-- Alerts Cards Container -->
    <div id="alerts-list-container" class="hidden">
      <div id="alerts-list" class="space-y-3">
        <!-- Injected dynamically via hazard-alerts.js -->
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="./assets/js/mock-data.js"></script>
  <script src="./assets/js/store.js"></script>
  <script src="./assets/js/toast.js"></script>
  <script src="./assets/js/components.js"></script>
  <script src="./assets/js/hazard-alerts.js"></script>
</body>
</html>
