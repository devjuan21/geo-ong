<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - GeoSafe Resident Portal | Barangay Bayanan</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen resident-layout">

  <div class="flex min-h-screen">
    <!-- Reusable Sidebar Container -->
    <div id="geosafe-sidebar-container"></div>

    <!-- Main Content Wrapper -->
    <div id="geosafe-main-wrapper" class="flex-1 flex flex-col min-w-0">
      <!-- Reusable Header Container -->
      <div id="geosafe-header-container"></div>

      <!-- Main Page Body -->
      <main class="flex-1 p-4 sm:p-6 pb-24 md:pb-8 max-w-3xl mx-auto w-full space-y-4">

        <!-- Compact Resident Header -->
        <div class="bg-white rounded-md p-4 sm:p-5 border border-slate-200 shadow-sm flex items-center gap-3.5">
          <div id="profile-page-avatar" class="w-12 h-12 rounded-md bg-brand-800 text-white font-bold text-base flex items-center justify-center flex-shrink-0">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          </div>
          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-2">
              <h2 id="profile-page-name" class="text-lg sm:text-xl font-bold text-slate-900 truncate">Resident Profile</h2>
              <span id="profile-status-badge" class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-700 border border-slate-200">
                Unverified Resident
              </span>
            </div>
            <p class="text-xs text-slate-500 mt-0.5">
              Resident ID: <strong id="profile-resident-id" class="font-mono text-slate-700">—</strong>
            </p>
          </div>
        </div>

        <!-- Loading State -->
        <div id="profile-loading" class="py-12 text-center">
          <div class="inline-block animate-spin rounded-full h-7 w-7 border-4 border-brand-200 border-t-brand-700 mb-2"></div>
          <p class="text-xs font-medium text-slate-500">Loading profile data...</p>
        </div>

        <!-- Error State -->
        <div id="profile-error" class="hidden p-5 rounded-md bg-rose-50 border border-rose-200 text-center max-w-md mx-auto">
          <h3 class="text-sm font-bold text-slate-900 mb-1">Failed to Load Profile</h3>
          <p id="profile-error-text" class="text-xs text-slate-600 mb-3">Please verify network connectivity.</p>
          <button onclick="loadProfileData()" class="px-4 py-2 bg-brand-900 text-white rounded-lg text-xs font-semibold">
            Retry
          </button>
        </div>

        <!-- Profile Form Container -->
        <div id="profile-container" class="hidden">
          <form id="resident-profile-form" class="bg-white rounded-md p-4 sm:p-6 border border-slate-200 shadow-sm space-y-5">

            <!-- Personal Information -->
            <div class="space-y-3">
              <h3 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider pb-1.5 border-b border-slate-100">
                Personal Information
              </h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <div>
                  <label for="profile-fname" class="block text-xs font-semibold text-slate-700 mb-1">First Name</label>
                  <input type="text" id="profile-fname" required class="w-full h-10 px-3 rounded-lg border border-slate-300 text-xs sm:text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                  <label for="profile-lname" class="block text-xs font-semibold text-slate-700 mb-1">Last Name</label>
                  <input type="text" id="profile-lname" required class="w-full h-10 px-3 rounded-lg border border-slate-300 text-xs sm:text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                  <label for="profile-email" class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
                  <input type="email" id="profile-email" required class="w-full h-10 px-3 rounded-lg border border-slate-300 text-xs sm:text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                  <label for="profile-phone" class="block text-xs font-semibold text-slate-700 mb-1">Primary Mobile Number</label>
                  <input type="tel" id="profile-phone" required class="w-full h-10 px-3 rounded-lg border border-slate-300 text-xs sm:text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
              </div>
            </div>

            <!-- Residential Address -->
            <div class="space-y-3">
              <h3 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider pb-1.5 border-b border-slate-100">
                Residential Address
              </h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <div class="sm:col-span-2">
                  <label for="profile-street" class="block text-xs font-semibold text-slate-700 mb-1">House Number / Street / Purok</label>
                  <input type="text" id="profile-street" required class="w-full h-10 px-3 rounded-lg border border-slate-300 text-xs sm:text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                  <label for="profile-barangay" class="block text-xs font-semibold text-slate-700 mb-1">Registered Barangay</label>
                  <input type="text" id="profile-barangay" readonly class="w-full h-10 px-3 rounded-lg border border-slate-200 bg-slate-50 text-xs sm:text-sm text-slate-600 cursor-not-allowed">
                </div>
                <div>
                  <label for="profile-city" class="block text-xs font-semibold text-slate-700 mb-1">City</label>
                  <input type="text" id="profile-city" readonly class="w-full h-10 px-3 rounded-lg border border-slate-200 bg-slate-50 text-xs sm:text-sm text-slate-600 cursor-not-allowed">
                </div>
              </div>
            </div>

            <!-- Form Actions -->
            <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
              <a href="index.html" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-700 text-xs font-semibold hover:bg-slate-100">
                Cancel
              </a>
              <button type="submit" id="btn-save-profile" class="px-5 py-2 rounded-lg bg-brand-900 hover:bg-brand-800 text-white font-bold text-xs shadow-sm transition-colors">
                Save Changes
              </button>
            </div>

          </form>
        </div>

      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./assets/js/mock-data.js"></script>
  <script src="./assets/js/store.js"></script>
  <script src="./assets/js/toast.js"></script>
  <script src="./assets/js/components.js"></script>
  <script src="./assets/js/profile.js"></script>
</body>
</html>
