<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hazard Alerts - GeoSafe Responder Portal | Barangay Bayanan</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col font-sans overflow-x-hidden">

  <!-- Top Operational Header & Desktop Sidebar -->
  <div id="geosafe-responder-nav-container"></div>

  <!-- Main Content -->
  <main class="flex-1 p-3.5 sm:p-5 lg:p-6 pb-28 md:pb-8 max-w-5xl mx-auto w-full space-y-3">

    <!-- Compact Page Title & Filter / Sort Controls -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2.5">
      <div class="flex items-center gap-2.5 shrink-0">
        <h1 class="text-lg sm:text-xl font-extrabold text-[#202020] tracking-tight whitespace-nowrap">Hazard Alerts</h1>
        <span id="alerts-total-badge" class="text-[10px] font-bold text-[#8A6800] bg-slate-50 border border-[#FFE872] px-2.5 py-0.5 rounded-full whitespace-nowrap">0 Active</span>
      </div>
      <div class="flex items-center sm:justify-end gap-2 flex-nowrap overflow-x-auto min-w-0 pb-0.5 sm:pb-0">
        <select id="alerts-filter-type" onchange="applyResponderAlertsFilterAndSort()"
          class="h-8 px-2.5 rounded-md border border-slate-200 bg-white text-xs font-semibold text-[#202020] focus:outline-none focus:border-[#F5B900] shrink-0 whitespace-nowrap">
          <option value="All">All Categories</option>
        </select>
        <select id="alerts-filter-status" onchange="loadResponderHazardAlerts()"
          class="h-8 px-2.5 rounded-md border border-slate-200 bg-white text-xs font-semibold text-[#202020] focus:outline-none focus:border-[#F5B900] shrink-0 whitespace-nowrap">
          <option value="active">Active Alerts</option>
          <option value="all">Alert History (All)</option>
        </select>
        <select id="alerts-sort-order" onchange="applyResponderAlertsFilterAndSort()"
          class="h-8 px-2.5 rounded-md border border-slate-200 bg-white text-xs font-semibold text-[#202020] focus:outline-none focus:border-[#F5B900] shrink-0 whitespace-nowrap">
          <option value="priority">Priority (Urgent First)</option>
          <option value="newest">Newest First</option>
        </select>
      </div>
    </div>

    <!-- Loading State -->
    <div id="alerts-loading" class="py-10 text-center">
      <div class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-[#FFE872] border-t-[#F5B900] mb-2"></div>
      <p class="text-xs font-medium text-[#777777]">Loading hazard alerts...</p>
    </div>

    <!-- Error State -->
    <div id="alerts-error" class="hidden p-4 rounded-lg bg-[#FFF1F1] border border-[#FFC2C2] flex items-center justify-between gap-3">
      <div class="min-w-0">
        <strong class="text-xs font-bold text-[#D93636] block">Alert feed unavailable</strong>
        <p id="alerts-error-text" class="text-[11px] text-[#D93636]">Please verify network connectivity.</p>
      </div>
      <button type="button" onclick="loadResponderHazardAlerts()" class="px-3 py-1.5 bg-[#D93636] hover:bg-[#B82828] text-white rounded-md text-xs font-bold flex-shrink-0">
        Retry
      </button>
    </div>

    <!-- Compact Empty State -->
    <div id="alerts-empty" class="hidden p-4 rounded-lg bg-white border border-slate-200 shadow-subtle flex items-center gap-3">
      <div class="w-8 h-8 rounded-md bg-emerald-50 text-[#278653] border border-emerald-200 flex items-center justify-center flex-shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      </div>
      <span class="text-xs sm:text-sm font-bold text-[#202020]">No hazard alerts at the moment.</span>
    </div>

    <!-- Alerts Cards Container -->
    <div id="alerts-list-container" class="hidden">
      <div id="alerts-list" class="space-y-3">
        <!-- Injected dynamically via responder-alerts.js -->
      </div>
    </div>

  </main>

  <!-- Advisory Detail Modal -->
  <div id="advisory-detail-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-lg max-w-lg w-full p-5 sm:p-6 shadow-subtle border border-slate-200 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-start justify-between gap-3 pb-3 border-b border-slate-200">
        <div class="space-y-1.5 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span id="modal-adv-badge"></span>
            <span id="modal-adv-urgency"></span>
            <span id="modal-adv-status" class="text-[10px] font-bold px-2 py-0.5 rounded-full border">Active</span>
          </div>
          <h2 id="modal-adv-title" class="text-base font-extrabold text-[#202020] leading-snug">-</h2>
        </div>
        <button type="button" onclick="closeResponderAdvisoryModal()" class="p-1.5 rounded-md text-[#777777] hover:text-[#202020] hover:bg-slate-100" aria-label="Close advisory details">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="space-y-3 text-xs">
        <p id="modal-adv-message" class="text-[#202020] whitespace-pre-line leading-relaxed">-</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 p-3 rounded-lg bg-slate-50 border border-slate-200">
          <div id="modal-adv-area-wrap">
            <span class="text-[10px] font-bold text-[#777777] uppercase block">Affected Location</span>
            <span id="modal-adv-area" class="font-semibold text-[#202020]">-</span>
          </div>
          <div>
            <span class="text-[10px] font-bold text-[#777777] uppercase block">Published (Asia/Manila)</span>
            <span id="modal-adv-date" class="font-semibold text-[#202020]">-</span>
          </div>
          <div id="modal-adv-expires-wrap">
            <span class="text-[10px] font-bold text-[#777777] uppercase block">Expires (Asia/Manila)</span>
            <span id="modal-adv-expires" class="font-semibold text-[#202020]">-</span>
          </div>
          <div>
            <span class="text-[10px] font-bold text-[#777777] uppercase block">Issued By</span>
            <span id="modal-adv-author" class="font-semibold text-[#202020]">-</span>
          </div>
          <div>
            <span class="text-[10px] font-bold text-[#777777] uppercase block">Reference</span>
            <span id="modal-adv-ref" class="font-mono font-bold text-[#202020]">-</span>
          </div>
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 pt-2">
        <a href="responder-map.html" class="px-4 py-2 rounded-md bg-slate-50 hover:bg-[#F5B900] border border-[#FFE872] text-xs font-bold text-[#202020]">Operations Map</a>
        <button type="button" onclick="closeResponderAdvisoryModal()" class="px-4 py-2 rounded-md bg-[#202020] text-white text-xs font-bold">Close</button>
      </div>
    </div>
  </div>

  <!-- Mobile Fixed Bottom Navigation Bar -->
  <div id="geosafe-responder-bottom-nav"></div>

  <!-- Scripts -->
  <script src="./assets/js/store.js"></script>
  <script src="./assets/js/toast.js"></script>
  <script src="./assets/js/advisory-categories.js"></script>
  <script src="./assets/js/responder-ui.js"></script>
  <script src="./assets/js/responder-alerts.js"></script>
</body>
</html>
